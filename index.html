<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>buttons</title>
<meta name="description" content="An endless page of buttons, menus, toggles and other interactive elements from across the web.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='28' height='16' rx='8' fill='%23111'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=DM+Sans:opsz,wght@9..40,100..1000&family=Space+Grotesk:wght@300..700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Syne:wght@400..800&family=Unbounded:wght@200..900&family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@100..800&family=IBM+Plex+Mono:wght@400;600&family=Roboto+Flex:opsz,wdth,wght,GRAD,slnt@8..144,25..151,100..1000,-200..150,-10..0&display=swap">
<style>
  :root {
    --bg: #ecece8;
    --gap: 18px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* rows are packed to the page width, so that width must not change when the scrollbar appears */
  html { overflow-y: scroll; }
  body {
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  #flow {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    padding: calc(var(--gap) * 1.5) 16px calc(var(--gap) * 4);
    margin: 0 auto;
  }
  /* hidden measuring area: same width as a row, laid out but invisible. Parked far above the page so it
     never adds to the scrollable height and never "intersects" the viewport: elements waiting here must not
     start their visibility-gated loops (IntersectionObserver ignores visibility: hidden). */
  #measure {
    position: absolute;
    left: 16px; right: 16px; top: -100000px;
    visibility: hidden;
    pointer-events: none;
    overflow: hidden; /* hidden content still counts toward the page's scroll width unless clipped */
    z-index: -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--gap);
  }
  .row, #measure { width: auto; }
  #measure .item.size-wide { flex: 0 0 auto; } /* measure wide elements at their natural width */
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--gap);
  }
  .row.spread { justify-content: space-between; }
  /* a vertical stack of shorter elements beside a tall one; spreads to fill the row height */
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    align-self: stretch;
    gap: var(--gap);
    flex: 0 0 auto;
    max-width: 100%;
  }
  .spacer { width: 100%; flex: none; }
  .item { position: relative; max-width: 100%; min-width: 0; }
  .item.size-auto { flex: 0 0 auto; }
  .item.size-wide { flex: 1 1 420px; }
  .item.size-full { flex: 1 1 100%; width: 100%; }
  /* anything that opens or grows overlays its neighbours instead of pushing them */
  .item:hover, .item:focus-within, .item[data-open] { z-index: 30; }
  .item:active { z-index: 31; }
  #sentinel { height: 1px; width: 100%; }

  /* category filter: a small round button that opens a panel of chips */
  #filter {
    position: fixed; right: 14px; bottom: 14px; z-index: 100;
    width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(17,17,17,.82); color: #fff; display: grid; place-items: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); opacity: .55; transition: opacity .15s, transform .15s;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #filter:hover, #filter:focus-visible, #filter[aria-expanded="true"] { opacity: 1; }
  #filter:active { transform: scale(.94); }
  #filter:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
  #filter svg { width: 16px; height: 16px; }
  #filter[data-active="true"]::after {
    content: ""; position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%;
    background: #4f8cff; border: 2px solid #ecece8;
  }
  #filter-panel {
    position: fixed; right: 14px; bottom: 58px; z-index: 100;
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end;
    max-width: min(420px, calc(100vw - 28px)); padding: 10px;
    background: rgba(255,255,255,.92); border: 1px solid rgba(0,0,0,.08); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.14);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    transform-origin: bottom right;
    transition: opacity .14s, transform .14s cubic-bezier(.2,.8,.2,1);
  }
  #filter-panel[hidden] { display: flex; opacity: 0; transform: scale(.96) translateY(4px); pointer-events: none; }
  #filter-panel button {
    font: 500 12px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .01em;
    padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(0,0,0,.14); background: #fff; color: #333; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  #filter-panel button[aria-pressed="true"] { background: #111; color: #fff; border-color: #111; }
  #filter-panel button:focus-visible { outline: 2px solid #4f8cff; outline-offset: 1px; }
  #filter-panel button.all { border-style: dashed; }

  /* long-press feedback */
  .item.holding { outline: 2px solid rgba(79,140,255,.0); animation: hold .6s linear forwards; }
  @keyframes hold { to { outline-color: rgba(79,140,255,.9); } }
  .item.copied { outline: 2px solid #4f8cff; outline-offset: 3px; border-radius: 6px; transition: outline-color .6s ease .4s; outline-color: transparent; }
  #toast {
    position: fixed; z-index: 101; pointer-events: none; transform: translate(-50%, -140%);
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
    background: #111; color: #fff; font: 500 12px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; transition: opacity .15s, transform .15s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -160%); }
  #toast svg { width: 13px; height: 13px; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    pointer-events: none; opacity: .35; font-size: 13px; letter-spacing: .1em;
  }
  #boot.hidden { display: none; }
</style>
</head>
<body>
<div id="boot">…</div>
<main id="flow" aria-label="interactive elements"><div id="measure" aria-hidden="true"></div></main>
<div id="sentinel" aria-hidden="true"></div>
<button id="filter" type="button" aria-label="Filter categories" aria-expanded="false" aria-controls="filter-panel">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
</button>
<div id="filter-panel" role="group" aria-label="Categories" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
